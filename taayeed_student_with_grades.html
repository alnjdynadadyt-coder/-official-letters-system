<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأييد طالب بالدرجات - نظام إصدار الكتب والمخاطبات الرسمية</title>
    <!-- استيراد باقة الخطوط العربية المتنوعة -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Changa:wght@400;700&family=El+Messiri:wght@400;700&family=Lateef&family=Readex+Pro:wght@400;700&family=Reem+Kufi:wght@400;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            direction: rtl;
            color: #2d3748;
        }
        .form-container {
            max-width: 750px;
            background: #ffffff;
            margin: 0 auto;
            padding: 18px 20px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            border-top: 5px solid #3182ce;
        }
        .form-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
        }
        h2 {
            color: #1a202c;
            margin: 0;
            font-size: 19px;
            font-weight: 700;
        }
        .section-box {
            border: 1px solid rgba(0,0,0,0.07);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        .sec-print { background: #f0f9ff; border-color: #bae6fd; }
        .sec-admin { background: #fdf4ff; border-color: #f5d0fe; }
        .sec-person { background: #f0fdf4; border-color: #bbf7d0; }

        .section-title {
            font-size: 13.5px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
            padding-bottom: 4px;
        }
        .sec-print .section-title { color: #0284c7; }
        .sec-admin .section-title { color: #c084fc; }
        .sec-person .section-title { color: #16a34a; }

        .form-group { margin-bottom: 8px; }
        .form-group:last-child { margin-bottom: 0; }
        label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
            color: #4a5568;
            font-size: 12.5px;
        }
        input, select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 12.5px;
            box-sizing: border-box;
            background-color: #fff;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }
        .btn-submit {
            background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 14.5px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 4px;
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.25);
            transition: all 0.2s;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #2b6cb0 0%, #2c5282 100%);
            box-shadow: 0 6px 15px rgba(49, 130, 206, 0.35);
        }
        .back-link {
            display: inline-block;
            background-color: #edf2f7;
            color: #4a5568;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .back-link:hover {
            background-color: #e2e8f0;
            color: #1a202c;
        }
        .back-link-bottom {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .btn-save-cache {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-save-cache:hover { background-color: #2b6cb0; }
        
        .btn-clear-cache {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-clear-cache:hover { background-color: #c53030; }

        #printArea { display: none; }

        @media print {
            @page { size: A4; margin: 0mm; }
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea {
                display: block;
                position: absolute;
                top: 0;
                right: 0;
                width: 210mm;
                height: 297mm;
                overflow: hidden;
                background: white;
                box-sizing: border-box;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="form-container no-print">
        <div class="form-header-flex">
            <h2>إصدار تأييد طالب بالدرجات</h2>
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
        </div>

        <form id="taayeedGradesForm" onsubmit="generatePDF(event)">
            
            <div class="section-box sec-print">
                <div class="section-title">⚙️ خيارات وتنسيق الطباعة، الإطارات والخطوط المتقدمة</div>
                
                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>إطار الورقة الفني:</label>
                        <select id="borderStyleInput">
                            <option value="solid-normal">إطار رسمي أنيق (عادي)</option>
                            <option value="solid-thick">إطار سميك بارز</option>
                            <option value="double">إطار مزدوج كلاسيكي</option>
                            <option value="fancy-double">إطار زخرفي مزدوج رفيع</option>
                            <option value="rounded">إطار بزوايا منحنية أنيقة</option>
                            <option value="dashed">إطار منقط رسمي</option>
                            <option value="none">بدون إطار</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>لون الخط العام:</label>
                        <select id="fontColorInput">
                            <option value="#000000">أسود داكن (أصلي)</option>
                            <option value="#1e3a8a">أزرق ملكي إداري</option>
                            <option value="#991b1b">أحمر رسمي</option>
                            <option value="#334155">رمادي غامق احترافي</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>نوع الخط (النص الأساسي فقط):</label>
                        <select id="fontFamilyInput">
                            <option value="'Traditional Arabic', serif">Traditional Arabic (التقليدي الرسمي)</option>
                            <option value="'Amiri', serif">أميري (Amiri - أصيل)</option>
                            <option value="'Scheherazade New', serif" selected>شهرزاد (Scheherazade - كلاسيكي)</option>
                            <option value="'Reem Kufi', sans-serif">الخط الكوفي (Reem Kufi)</option>
                            <option value="'El Messiri', sans-serif">المسيري (El Messiri - مميز)</option>
                            <option value="'Lateef', serif">لطيف (Lateef - نسخ دقيق)</option>
                            <option value="'Tajawal', sans-serif">تجوال (Tajawal - حديث)</option>
                            <option value="'Cairo', sans-serif">كايرو (Cairo - عريض)</option>
                            <option value="'Changa', sans-serif">شنطة/شانجا (Changa)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>حجم الخط (النص الأساسي فقط):</label>
                        <select id="fontSizeInput">
                            <option value="14px">14</option>
                            <option value="15px">15</option>
                            <option value="16px">16</option>
                            <option value="17px">17</option>
                            <option value="18px">18</option>
                            <option value="19px">19</option>
                            <option value="20px">20</option>
                            <option value="22px" selected>22</option>
                            <option value="24px">24</option>
                            <option value="26px">26</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>نوع خط العناوين (الترويسة، المدرسة، اسم المدير):</label>
                        <select id="titleFontFamilyInput">
                            <option value="inherit">نفس خط النص الأساسي</option>
                            <option value="'Amiri', serif" selected>أميري (Amiri)</option>
                            <option value="'Cairo', sans-serif">كايرو (Cairo)</option>
                            <option value="'Reem Kufi', sans-serif">الخط الكوفي (Reem Kufi)</option>
                            <option value="'Tajawal', sans-serif">تجوال (Tajawal)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>حجم خط العناوين:</label>
                        <select id="titleFontSizeInput">
                            <option value="matched">تلقائي متناسق</option>
                            <option value="16px">16px</option>
                            <option value="18px" selected>18px</option>
                            <option value="20px">20px</option>
                            <option value="22px">22px</option>
                            <option value="24px">24px</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="section-box sec-admin">
                <div class="section-title">📋 المعلومات الإدارية للكتاب</div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>الترويسة العليا (المديرية):</label>
                        <input type="text" id="headerTitleInput" required placeholder="مثال: المديرية العامة لتربية القادسية - قسم تربية الحمزة">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>اسم المدرسة:</label>
                        <input type="text" id="schoolNameInput" required placeholder="مثال: اعدادية النجدين للبنين">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>رقم العدد:</label>
                        <input type="text" id="bookNumberInput" required placeholder="مثال: 1333">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>التاريخ:</label>
                        <input type="date" id="dateInput" required>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 8px;">
                    <label>إلى / (الجهة المطلوبة):</label>
                    <input type="text" id="targetEntity" required placeholder="مثال: جامعة او مدرسة">
                </div>
            </div>

            <div class="section-box sec-person">
                <div class="section-title">👤 بيانات الطالب والدراسة</div>
                <div style="display: flex; gap: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>المرحلة الدراسية:</label>
                        <select id="stageSelect" onchange="updateSubjects()">
                            <option value="third">الثالث المتوسط</option>
                            <option value="sci">السادس العلمي</option>
                            <option value="art">السادس الأدبي</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>جنس الطالب:</label>
                        <select id="studentGender">
                            <option value="male">ذكر (طالب)</option>
                            <option value="female">أنثى (طالبة)</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <div class="form-group" style="flex: 2;">
                        <label>اسم الطالب الثلاثي:</label>
                        <input type="text" id="studentName" required placeholder="أدخل اسم الطالب كاملاً">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>التولد:</label>
                        <input type="text" id="studentBirth" required placeholder="مثال: 2000">
                    </div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>الرقم الامتحاني:</label>
                        <input type="text" id="examNumber" required oninput="this.value = this.value.replace(/[^0-9٠-٩]/g, '')" placeholder="أرقام فقط">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>العام الدراسي:</label>
                        <input type="text" id="academicYear" required placeholder="مثال: 2025 - 2026">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>الدور:</label>
                        <select id="examRound">
                            <option value="الأول">الأول</option>
                            <option value="الثاني">الثاني</option>
                            <option value="الثالث">الثالث</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 8px;">
                    <label>اسم مدير المدرسة:</label>
                    <input type="text" id="managerName" required placeholder="أدخل اسم المدير">
                </div>
                <div class="form-group" style="margin-top: 8px;">
                    <label>اضافة نص، اختياري (يظهر في سطر جديد أسفل التأييد):</label>
                    <input type="text" id="optionalTextInput" placeholder="">
                </div>
            </div>

            <div class="section-box" style="background: #fff; border-color: #cbd5e0;">
                <div class="section-title" style="color: #2d3748;">📊 درجات المواد الدراسية</div>
                <div id="dynamicInputsContainer"></div>
            </div>

            <button type="submit" class="btn-submit">عرض وطباعة كتاب التأييد (PDF)</button>
        </form>

        <div class="back-link-bottom">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
            <button type="button" class="btn-save-cache" onclick="manualSaveSettings()">حفظ مؤقت للإعدادات والترويسة</button>
            <button type="button" class="btn-clear-cache" onclick="manualClearSettings()">إلغاء وحذف الحفظ المؤقت</button>
        </div>
    </div>

    <div id="printArea">
        <div id="documentWrapper" style="width: 100%; height: 100%; box-sizing: border-box;"></div>
    </div>

    <script>
        function manualSaveSettings() {
            localStorage.setItem('saved_headerTitle_grades', document.getElementById('headerTitleInput').value);
            localStorage.setItem('saved_schoolName_grades', document.getElementById('schoolNameInput').value);
            localStorage.setItem('saved_managerName_grades', document.getElementById('managerName').value);
            localStorage.setItem('saved_fontFamily_grades', document.getElementById('fontFamilyInput').value);
            localStorage.setItem('saved_fontSize_grades', document.getElementById('fontSizeInput').value);
            localStorage.setItem('saved_titleFontFamily_grades', document.getElementById('titleFontFamilyInput').value);
            localStorage.setItem('saved_titleFontSize_grades', document.getElementById('titleFontSizeInput').value);
            localStorage.setItem('saved_borderStyle_grades', document.getElementById('borderStyleInput').value);
            localStorage.setItem('saved_fontColor_grades', document.getElementById('fontColorInput').value);
            alert('تم حفظ الإعدادات والترويسة مؤقتاً بنجاح!');
        }

        function manualClearSettings() {
            localStorage.removeItem('saved_headerTitle_grades');
            localStorage.removeItem('saved_schoolName_grades');
            localStorage.removeItem('saved_managerName_grades');
            localStorage.removeItem('saved_fontFamily_grades');
            localStorage.removeItem('saved_fontSize_grades');
            localStorage.removeItem('saved_titleFontFamily_grades');
            localStorage.removeItem('saved_titleFontSize_grades');
            localStorage.removeItem('saved_borderStyle_grades');
            localStorage.removeItem('saved_fontColor_grades');
            alert('تم إلغاء وحذف كافة البيانات المحفوظة مؤقتاً وعودتها للأصل.');
            location.reload();
        }

        function loadSettingsIfSaved() {
            if(localStorage.getItem('saved_headerTitle_grades')) {
                document.getElementById('headerTitleInput').value = localStorage.getItem('saved_headerTitle_grades');
                document.getElementById('schoolNameInput').value = localStorage.getItem('saved_schoolName_grades');
                document.getElementById('managerName').value = localStorage.getItem('saved_managerName_grades');
                document.getElementById('fontFamilyInput').value = localStorage.getItem('saved_fontFamily_grades');
                document.getElementById('fontSizeInput').value = localStorage.getItem('saved_fontSize_grades');
                document.getElementById('titleFontFamilyInput').value = localStorage.getItem('saved_titleFontFamily_grades');
                document.getElementById('titleFontSizeInput').value = localStorage.getItem('saved_titleFontSize_grades');
                document.getElementById('borderStyleInput').value = localStorage.getItem('saved_borderStyle_grades');
                document.getElementById('fontColorInput').value = localStorage.getItem('saved_fontColor_grades');
            }
        }

        const subjectsData = {
            third: ["التربية الإسلامية واللغة العربية", "اللغة الانكليزية", "الرياضيات", "الاجتماعيات", "الأحياء", "الكيمياء", "الفيزياء"],
            sci: ["التربية الإسلامية", "اللغة العربية", "اللغة الانكليزية", "الأحياء", "الرياضيات", "الكيمياء", "الفيزياء", ""],
            art: ["التربية الإسلامية", "اللغة العربية", "اللغة الانكليزية", "التاريخ", "الرياضيات", "الجغرافية", "الاقتصاد"]
        };

        const numbersToWords = {
            "50": "خمسون", "51": "واحد وخمسون", "52": "اثنان وخمسون", "53": "ثلاثة وخمسون", "54": "أربعة وخمسون", "55": "خمسة وخمسون", "56": "ستة وخمسون", "57": "سبعة وخمسون", "58": "ثمانية وخمسون", "59": "تسعة وخمسون",
            "60": "ستون", "61": "واحد وستون", "62": "اثنان وستون", "63": "ثلاثة وستون", "64": "أربعة وستون", "65": "خمسة وستون", "66": "ست و ستون", "67": "سبعة وستون", "68": "ثمانية وستون", "69": "تسعة وستون",
            "70": "سبعون", "71": "واحد وسبعون", "72": "اثنان وسبعون", "73": "ثلاثة وسبعون", "74": "أربعة وسبعون", "75": "خمسة وسبعون", "76": "ستة وسبعون", "77": "سبعة وسبعون", "78": "ثمانية وسبعون", "79": "تسعة وسبعون",
            "80": "ثمانون", "81": "واحد وثمانون", "82": "اثنان وثمانون", "83": "ثلاثة وثمانون", "84": "أربعة وثمانون", "85": "خمسة وثمانون", "86": "ستة وثمانون", "87": "سبعة وثمانون", "88": "ثمانية وثمانون", "89": "تسعة وثمانون",
            "90": "تسعون", "91": "واحد وتسعون", "92": "اثنان وتسعون", "93": "ثلاثة وتسعون", "94": "أربعة وتسعون", "95": "خمسة وتسعون", "96": "ستة وتسعون", "97": "سبعة وتسعون", "98": "ثمانية وتسعون", "99": "تسعة وتسعون",
            "100": "مائة", "300": "ثلاثمائة", "480": "أربعمائة وثمانون", "600": "ستمائة"
        };

        function convertToWords(numStr) {
            if (numStr === "-" || numStr === "") return "-";
            if (numbersToWords[numStr]) return numbersToWords[numStr];
            return numStr;
        }

        function handleNumberInput(inputElem, textElemId) {
            let val = inputElem.value.replace(/[^0-9٠-٩\-]/g, '');
            inputElem.value = val;
            const textElem = document.getElementById(textElemId);
            if (textElem) {
                textElem.value = convertToWords(val);
            }
        }

        function updateSubjects() {
            const stage = document.getElementById('stageSelect').value;
            const subs = subjectsData[stage];
            let container = document.getElementById('dynamicInputsContainer');
            container.innerHTML = '';

            subs.forEach((sub, index) => {
                container.innerHTML += `
                    <div style="display: flex; gap: 6px; margin-bottom: 5px; align-items: center;">
                        <input type="text" value="${sub}" id="sub_name_${index}" placeholder="اسم المادة" style="flex: 1.5; font-size: 12px; padding: 5px 8px;">
                        <input type="text" placeholder="الدرجة رقماً" id="sub_num_${index}" oninput="handleNumberInput(this, 'sub_text_${index}')" style="flex: 1; padding: 5px 8px;">
                        <input type="text" placeholder="الدرجة كتابةً" id="sub_text_${index}" style="flex: 1.5; padding: 5px 8px;">
                    </div>
                `;
            });

            container.innerHTML += `
                <div style="display: flex; gap: 6px; margin-top: 8px; border-top: 1px solid #edf2f7; padding-top: 6px; align-items: center;">
                    <span style="flex: 1.5; font-size: 12.5px; font-weight: bold;">المجموع:</span>
                    <input type="text" placeholder="المجموع رقماً" id="totalNum" oninput="handleNumberInput(this, 'totalText')" style="flex: 1; padding: 5px 8px;">
                    <input type="text" placeholder="المجموع كتابةً" id="totalText" style="flex: 1.5; padding: 5px 8px;">
                </div>
                <div style="display: flex; gap: 6px; margin-top: 5px; align-items: center;" id="averageRow">
                    <span style="flex: 1.5; font-size: 12.5px; font-weight: bold;">المعدل:</span>
                    <input type="text" placeholder="المعدل" id="averageVal" oninput="this.value = this.value.replace(/[^0-9٠-٩\.]/g, '')" style="flex: 2.5; padding: 5px 8px;">
                </div>
            `;

            if (stage === 'third') {
                document.getElementById('averageRow').style.display = 'none';
            }
        }

        window.onload = function() {
            loadSettingsIfSaved();
            updateSubjects();
            const today = new Date().toISOString().split('T')[0];
            if(!document.getElementById('dateInput').value) document.getElementById('dateInput').value = today;
        };

        function formatDateToDMY(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            return `${parts[2]} / ${parts[1]} / ${parts[0]}م`;
        }

        function generatePDF(e) {
            e.preventDefault();

            const headerTitle = document.getElementById('headerTitleInput').value;
            const schoolName = document.getElementById('schoolNameInput').value;
            const bookNum = document.getElementById('bookNumberInput').value;
            const dateVal = formatDateToDMY(document.getElementById('dateInput').value);
            const target = document.getElementById('targetEntity').value;
            
            const stage = document.getElementById('stageSelect').value;
            const stageNames = { third: "الثالث المتوسط", sci: "السادس العلمي", art: "السادس الأدبي" };
            const gender = document.getElementById('studentGender').value;
            const name = document.getElementById('studentName').value;
            const birth = document.getElementById('studentBirth').value;
            const examNum = document.getElementById('examNumber').value;
            const year = document.getElementById('academicYear').value;
            const round = document.getElementById('examRound').value;
            const manager = document.getElementById('managerName').value;
            const optionalText = document.getElementById('optionalTextInput').value.trim();

            const selectedFont = document.getElementById('fontFamilyInput').value;
            const baseFontSize = parseInt(document.getElementById('fontSizeInput').value);
            const borderStyleChoice = document.getElementById('borderStyleInput').value;
            const fontColor = document.getElementById('fontColorInput').value;
            
            const titleFont = document.getElementById('titleFontFamilyInput').value;
            const titleSizeChoice = document.getElementById('titleFontSizeInput').value;

            let line1 = "";
            let line2 = "";
            let line3 = "";

            if (gender === 'male') {
                line1 = `نؤيد لكم أن الطالب (<b>${name}</b>) تولد (${birth}) أحد طلاب الصف (${stageNames[stage]}) ذو الرقم الامتحاني (${examNum}) وقد دخل الامتحان الوزاري للعام الدراسي (${year}) وكان ناجحاً من الدور (${round}).`;
            } else {
                line1 = `نؤيد لكم أن الطالبة (<b>${name}</b>) تولد (${birth}) إحدى طالبات الصف (${stageNames[stage]}) ذات الرقم الامتحاني (${examNum}) وقد دخلت الامتحان الوزاري للعام الدراسي (${year}) وكانت ناجحة من الدور (${round}).`;
            }
            
            line2 = `وبناءً على ${gender === 'male' ? 'طلبه' : 'طلبها'} زود بهذا التأييد.`;

            if (optionalText) {
                line3 = optionalText;
            }

            let borderCSS = "2.5px solid #1a202c";
            let borderRadiusCSS = "8px";
            if (borderStyleChoice === 'solid-thick') borderCSS = "4px solid #1a202c";
            if (borderStyleChoice === 'double') borderCSS = "4px double #1a202c";
            if (borderStyleChoice === 'fancy-double') borderCSS = "1px solid #1a202c; outline: 2px solid #1a202c; outline-offset: 3px;";
            if (borderStyleChoice === 'rounded') { borderCSS = "2.5px solid #1a202c"; borderRadiusCSS = "20px"; }
            if (borderStyleChoice === 'dashed') borderCSS = "2px dashed #1a202c";
            if (borderStyleChoice === 'none') borderCSS = "none";

            const bodySize = baseFontSize + 'px';
            const actualTitleFont = titleFont === 'inherit' ? selectedFont : titleFont;
            const actualTitleSize = titleSizeChoice === 'matched' ? (baseFontSize + 2) + 'px' : titleSizeChoice;
            const tableFontSize = (baseFontSize - 4) + 'px';

            const subs = subjectsData[stage];
            let tableRows = "";
            subs.forEach((sub, index) => {
                const sName = document.getElementById(`sub_name_${index}`).value;
                const nVal = document.getElementById(`sub_num_${index}`).value;
                const tVal = document.getElementById(`sub_text_${index}`).value;
                if(sName.trim() !== "" || nVal.trim() !== "" || tVal.trim() !== "") {
                    tableRows += `<tr><td style="border: 1px solid ${fontColor}; padding: 1.5px 6px; text-align: right;">${sName}</td><td style="border: 1px solid ${fontColor}; padding: 1.5px 6px; text-align: center; width: 18%;"><b>${nVal}</b></td><td style="border: 1px solid ${fontColor}; padding: 1.5px 6px; text-align: center; width: 28%;"><b>${tVal}</b></td></tr>`;
                }
            });

            const totalNum = document.getElementById('totalNum').value;
            const totalText = document.getElementById('totalText').value;
            tableRows += `<tr><td style="border: 1px solid ${fontColor}; padding: 1.5px 6px; font-weight: bold; text-align: right;">المجموع</td><td style="border: 1px solid ${fontColor}; padding: 1.5px 6px; text-align: center; font-weight: bold;">${totalNum}</td><td style="border: 1px solid ${fontColor}; padding: 1.5px 6px; text-align: center; font-weight: bold;">${totalText}</td></tr>`;

            if (stage !== 'third') {
                const avgVal = document.getElementById('averageVal').value;
                if(avgVal) {
                    tableRows += `<tr><td style="border: 1px solid ${fontColor}; padding: 1.5px 6px; font-weight: bold; text-align: right;">المعدل</td><td colspan="2" style="border: 1px solid ${fontColor}; padding: 1.5px 6px; text-align: center; font-weight: bold;">${avgVal}</td></tr>`;
                }
            }

            const wrapper = document.getElementById('documentWrapper');
            wrapper.innerHTML = `
                <div style="height: 297mm; display: flex; flex-direction: column; justify-content: center;">
                    <div style="font-family: ${selectedFont}; color: ${fontColor}; margin: 4mm 8mm; border: ${borderCSS}; border-radius: ${borderRadiusCSS}; padding: 5mm 10px 5mm 10px; background: #fff; height: 288mm; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <!-- الترويسة العليا -->
                            <div style="font-family: ${actualTitleFont}; text-align: center; font-weight: bold; font-size: ${actualTitleSize}; margin-bottom: 2mm; line-height: 1.3;">
                                ${headerTitle}
                            </div>

                            <!-- معلومات المدرسة والعدد والتاريخ وصورة الطالب -->
                            <table style="width: 100%; border-collapse: collapse; margin-bottom: 2mm; font-weight: bold; font-family: ${actualTitleFont}; font-size: ${actualTitleSize}; color: ${fontColor};">
                                <tr>
                                    <td style="width: 50%; vertical-align: top; text-align: right;">
                                        <div>إدارة / ${schoolName}</div>
                                    </td>
                                    <td style="width: 50%; text-align: left; vertical-align: top;">
                                        <div style="display: inline-flex; flex-direction: column; align-items: flex-end;">
                                            <div style="text-align: right; min-width: 130px;">
                                                العدد: ${bookNum}<br>
                                                التاريخ: ${dateVal}
                                            </div>
                                            <div style="margin-top: 3px; width: 17mm; height: 21mm; border: 1px dashed ${fontColor}; display: flex; align-items: center; justify-content: center; font-size: 8px; opacity: 0.65; background: #fafafa;">مكان الصورة</div>
                                        </div>
                                    </td>
                                </tr>
                            </table>

                            <!-- إلى والموضوع -->
                            <div style="margin-bottom: 3mm; margin-top: -2mm;">
                                <div style="font-family: ${actualTitleFont}; text-align: center; font-size: ${actualTitleSize}; font-weight: bold; margin-bottom: 1.5mm;">
                                    إلى / ${target}
                                </div>
                                <div style="font-family: ${actualTitleFont}; text-align: center; font-size: ${actualTitleSize}; font-weight: bold;">
                                    م / تأييد طالب بالدرجات
                                </div>
                            </div>

                            <!-- نص التأييد بأسطر مستقلة -->
                            <div style="font-size: ${bodySize}; line-height: 1.6; text-align: justify; padding: 0 2mm; margin-bottom: 3mm;">
                                <div style="margin-bottom: 2px;">${line1}</div>
                                <div style="margin-bottom: 2px;">${line2}</div>
                                ${line3 ? `<div style="margin-bottom: 2px;">${line3}</div>` : ''}
                            </div>

                            <!-- جدول الدرجات -->
                            <table style="width: 82%; margin: 0 auto; border-collapse: collapse; font-size: ${tableFontSize}; margin-bottom: 2mm; color: ${fontColor};">
                                <thead>
                                    <tr style="background: rgba(0,0,0,0.03);">
                                        <th style="border: 1px solid ${fontColor}; padding: 2px 5px; text-align: right;">المادة</th>
                                        <th style="border: 1px solid ${fontColor}; padding: 2px 5px; text-align: center; width: 22%;">الدرجة رقماً</th>
                                        <th style="border: 1px solid ${fontColor}; padding: 2px 5px; text-align: center; width: 32%;">الدرجة كتابةً</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>

                        <!-- التوقيع والإطار الدائري لاسم المدير -->
                        <div style="margin-bottom: 2mm;">
                            <div style="text-align: center; font-size: ${bodySize}; font-weight: bold; margin-bottom: 3mm;">
                                للعـلم مع التقـدير
                            </div>

                            <table style="width: 100%; border-collapse: collapse; color: ${fontColor};">
                                <tr>
                                    <td style="width: 50%;"></td>
                                    <td style="width: 50%; text-align: left; padding-left: 5mm;">
                                        <div style="display: inline-block; border: 1.5px solid ${fontColor}; border-radius: 12px; padding: 6px 18px; text-align: center; min-width: 170px;">
                                            <div style="font-family: ${actualTitleFont}; font-size: ${actualTitleSize}; font-weight: bold; margin-bottom: 2px;">${manager}</div>
                                            <div style="font-family: ${actualTitleFont}; font-size: ${parseInt(actualTitleSize)-2}px; font-weight: normal;">مدير المدرسة</div>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                window.print();
            }, 150);
        }
    </script>
</body>
</html>
