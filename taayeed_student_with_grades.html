<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأييد طالب بالدرجات - نظام إصدار الكتب والمخاطبات الرسمية</title>
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            direction: rtl;
            color: #2d3748;
        }
        .form-container {
            max-width: 750px;
            background: #ffffff;
            margin: 0 auto;
            padding: 18px 20px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            border-top: 5px solid #3182ce;
        }
        .form-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
        }
        h2 {
            color: #1a202c;
            margin: 0;
            font-size: 19px;
            font-weight: 700;
        }
        .section-box {
            border: 1px solid rgba(0,0,0,0.07);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
        }
        .sec-print { background: #f0f9ff; border-color: #bae6fd; }
        .sec-admin { background: #fdf4ff; border-color: #f5d0fe; }
        .sec-person { background: #f0fdf4; border-color: #bbf7d0; }

        .section-title {
            font-size: 13.5px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
            padding-bottom: 4px;
        }
        .sec-print .section-title { color: #0284c7; }
        .sec-admin .section-title { color: #c084fc; }
        .sec-person .section-title { color: #16a34a; }

        .form-group {
            margin-bottom: 8px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
            color: #4a5568;
            font-size: 12.5px;
        }
        input, select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 12.5px;
            box-sizing: border-box;
            background-color: #fff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }
        .btn-submit {
            background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 14.5px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 4px;
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.25);
        }
        .back-link {
            display: inline-block;
            background-color: #edf2f7;
            color: #4a5568;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .back-link-bottom {
            display: block;
            text-align: center;
            margin-top: 12px;
        }
        #printArea {
            display: none;
        }
        @media print {
            @page {
                size: A4;
                margin: 0mm;
            }
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                display: block;
                position: absolute;
                top: 0;
                right: 0;
                width: 210mm;
                height: 297mm;
                overflow: hidden;
                font-family: 'Traditional Arabic', 'Amiri', serif;
                background: white;
                color: black;
                box-sizing: border-box;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="form-container no-print">
        <div class="form-header-flex">
            <h2>إصدار تأييد طالب بالدرجات</h2>
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
        </div>

        <div id="taayeedGradesForm">
            
            <div class="section-box sec-print">
                <div class="section-title">⚙️ الخيارات وطريقة الطباعة</div>
                <div class="form-group">
                    <label>نظام النسخ:</label>
                    <select id="copiesLayout">
                        <option value="one">نسخة واحدة (تملأ الصفحة)</option>
                        <option value="two">نسختان (نفس الورقة)</option>
                    </select>
                </div>
            </div>

            <div class="section-box sec-admin">
                <div class="section-title">📋 المعلومات الإدارية للكتاب</div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>الترويسة العليا (المديرية):</label>
                        <input type="text" id="headerTitleInput" placeholder="مثال: المديرية العامة لتربية القادسية - قسم تربية الحمزة">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>اسم المدرسة:</label>
                        <input type="text" id="schoolNameInput" placeholder="مثال: اعدادية النجدين للبنين">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>رقم العدد:</label>
                        <input type="text" id="bookNumberInput" placeholder="مثال: 1333">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>التاريخ:</label>
                        <input type="date" id="dateInput">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 8px;">
                    <label>إلى / (الجهة المطلوبة):</label>
                    <input type="text" id="targetEntity" placeholder="مثال: جامعة القادسية">
                </div>
            </div>

            <div class="section-box sec-person">
                <div class="section-title">👤 بيانات الطالب والدراسة</div>
                <div style="display: flex; gap: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>المرحلة الدراسية:</label>
                        <select id="stageSelect" onchange="updateSubjects()">
                            <option value="third">الثالث المتوسط</option>
                            <option value="sci">السادس العلمي</option>
                            <option value="art">السادس الأدبي</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>جنس الطالب:</label>
                        <select id="studentGender">
                            <option value="male">ذكر (طالب)</option>
                            <option value="female">أنثى (طالبة)</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <div class="form-group" style="flex: 2;">
                        <label>اسم الطالب الثلاثي:</label>
                        <input type="text" id="studentName" placeholder="أدخل اسم الطالب كاملاً">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>التولد:</label>
                        <input type="text" id="studentBirth" placeholder="مثال: 2000">
                    </div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>الرقم الامتحاني:</label>
                        <input type="text" id="examNumber" oninput="this.value = this.value.replace(/[^0-9٠-٩]/g, '')" placeholder="أرقام فقط">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>العام الدراسي:</label>
                        <input type="text" id="academicYear" placeholder="مثال: 2025 - 2026">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>الدور:</label>
                        <select id="examRound">
                            <option value="الأول">الأول</option>
                            <option value="الثاني">الثاني</option>
                            <option value="الثالث">الثالث</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 8px;">
                    <label>اسم مدير المدرسة:</label>
                    <input type="text" id="managerName" placeholder="أدخل اسم المدير">
                </div>
            </div>

            <div class="section-box" style="background: #fff; border-color: #cbd5e0;">
                <div class="section-title" style="color: #2d3748;">📊 درجات المواد الدراسية</div>
                <div id="dynamicInputsContainer"></div>
            </div>

            <button type="button" class="btn-submit" onclick="generatePDF()">عرض وطباعة كتاب التأييد (PDF)</button>
        </div>

        <div class="back-link-bottom">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
        </div>
    </div>

    <div id="printArea">
        <div id="documentWrapper" style="width: 100%; height: 100%; box-sizing: border-box;"></div>
    </div>

    <script>
        const subjectsData = {
            third: ["التربية الإسلامية واللغة العربية", "اللغة الانكليزية", "الرياضيات", "الاجتماعيات", "الأحياء", "الكيمياء", "الفيزياء"],
            sci: ["التربية الإسلامية", "اللغة العربية", "اللغة الانكليزية", "الأحياء", "الرياضيات", "الكيمياء", "الفيزياء"],
            art: ["التربية الإسلامية", "اللغة العربية", "اللغة الانكليزية", "التاريخ", "الرياضيات", "الجغرافية", "الاقتصاد"]
        };

        const numbersToWords = {
            "50": "خمسون", "51": "واحد وخمسون", "52": "اثنان وخمسون", "53": "ثلاثة وخمسون", "54": "أربعة وخمسون", "55": "خمسة وخمسون", "56": "ستة وخمسون", "57": "سبعة وخمسون", "58": "ثمانية وخمسون", "59": "تسعة وخمسون",
            "60": "ستون", "61": "واحد وستون", "62": "اثنان وستون", "63": "ثلاثة وستون", "64": "أربعة وستون", "65": "خمسة وستون", "66": "ست و ستون", "67": "سبعة وستون", "68": "ثمانية وستون", "69": "تسعة وستون",
            "70": "سبعون", "71": "واحد وسبعون", "72": "اثنان وسبعون", "73": "ثلاثة وسبعون", "74": "أربعة وسبعون", "75": "خمسة وسبعون", "76": "ستة وسبعون", "77": "سبعة وسبعون", "78": "ثمانية وسبعون", "79": "تسعة وسبعون",
            "80": "ثمانون", "81": "واحد وثمانون", "82": "اثنان وثمانون", "83": "ثلاثة وثمانون", "84": "أربعة وثمانون", "85": "خمسة وثمانون", "86": "ستة وثمانون", "87": "سبعة وثمانون", "88": "ثمانية وثمانون", "89": "تسعة وثمانون",
            "90": "تسعون", "91": "واحد وتسعون", "92": "اثنان وتسعون", "93": "ثلاثة وتسعون", "94": "أربعة وتسعون", "95": "خمسة وتسعون", "96": "ستة وتسعون", "97": "سبعة وتسعون", "98": "ثمانية وتسعون", "99": "تسعة وتسعون",
            "100": "مائة", "300": "ثلاثمائة", "480": "أربعمائة وثمانون", "600": "ستمائة"
        };

        function convertToWords(numStr) {
            if (numStr === "-" || numStr === "") return "-";
            if (numbersToWords[numStr]) return numbersToWords[numStr];
            return numStr;
        }

        function handleNumberInput(inputElem, textElemId) {
            let val = inputElem.value.replace(/[^0-9٠-٩\-]/g, '');
            inputElem.value = val;
            const textElem = document.getElementById(textElemId);
            if (textElem) {
                textElem.value = convertToWords(val);
            }
        }

        function updateSubjects() {
            const stage = document.getElementById('stageSelect').value;
            const subs = subjectsData[stage];
            let container = document.getElementById('dynamicInputsContainer');
            container.innerHTML = '';

            subs.forEach((sub, index) => {
                container.innerHTML += `
                    <div style="display: flex; gap: 6px; margin-bottom: 5px; align-items: center;">
                        <input type="text" value="${sub}" id="sub_name_${index}" style="flex: 1.5; font-size: 12px; padding: 5px 8px;">
                        <input type="text" placeholder="الدرجة رقماً" id="sub_num_${index}" oninput="handleNumberInput(this, 'sub_text_${index}')" style="flex: 1; padding: 5px 8px;">
                        <input type="text" placeholder="الدرجة كتابةً" id="sub_text_${index}" style="flex: 1.5; padding: 5px 8px;">
                    </div>
                `;
            });

            container.innerHTML += `
                <div style="display: flex; gap: 6px; margin-bottom: 5px; align-items: center;">
                    <input type="text" placeholder="اسم المادة (اختياري)" id="extra_sub_name" style="flex: 1.5; font-size: 12px; padding: 5px 8px;">
                    <input type="text" placeholder="الدرجة رقماً" id="extra_sub_num" oninput="handleNumberInput(this, 'extra_sub_text')" style="flex: 1; padding: 5px 8px;">
                    <input type="text" placeholder="الدرجة كتابةً" id="extra_sub_text" style="flex: 1.5; padding: 5px 8px;">
                </div>
            `;

            container.innerHTML += `
                <div style="display: flex; gap: 6px; margin-top: 8px; border-top: 1px solid #edf2f7; padding-top: 6px; align-items: center;">
                    <span style="flex: 1.5; font-size: 12.5px; font-weight: bold;">المجموع:</span>
                    <input type="text" placeholder="المجموع رقماً" id="totalNum" oninput="handleNumberInput(this, 'totalText')" style="flex: 1; padding: 5px 8px;">
                    <input type="text" placeholder="المجموع كتابةً" id="totalText" style="flex: 1.5; padding: 5px 8px;">
                </div>
                <div style="display: flex; gap: 6px; margin-top: 5px; align-items: center;" id="averageRow">
                    <span style="flex: 1.5; font-size: 12.5px; font-weight: bold;">المعدل:</span>
                    <input type="text" placeholder="المعدل" id="averageVal" oninput="this.value = this.value.replace(/[^0-9٠-٩\.]/g, '')" style="flex: 2.5; padding: 5px 8px;">
                </div>
            `;

            if (stage === 'third') {
                document.getElementById('averageRow').style.display = 'none';
            }
        }

        window.onload = function() {
            updateSubjects();
        };

        function formatDateToDMY(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            return `${parts[2]} / ${parts[1]} / ${parts[0]}م`;
        }

        function generatePDF() {
            const headerTitle = document.getElementById('headerTitleInput').value;
            const schoolName = document.getElementById('schoolNameInput').value;
            const bookNum = document.getElementById('bookNumberInput').value;
            const dateVal = formatDateToDMY(document.getElementById('dateInput').value);
            const target = document.getElementById('targetEntity').value;
            
            const stage = document.getElementById('stageSelect').value;
            const stageNames = { third: "الثالث المتوسط", sci: "السادس العلمي", art: "السادس الأدبي" };
            const gender = document.getElementById('studentGender').value;
            const name = document.getElementById('studentName').value;
            const birth = document.getElementById('studentBirth').value;
            const examNum = document.getElementById('examNumber').value;
            const year = document.getElementById('academicYear').value;
            const round = document.getElementById('examRound').value;
            const manager = document.getElementById('managerName').value;
            const layoutMode = document.getElementById('copiesLayout').value;

            // تنسيق النصوص على 3 أسطر منفصلة بدقة حسب طلبك
            let line1 = "";
            let line2 = "";
            let line3 = "";

            if (gender === 'male') {
                line1 = `نؤيد لكم أن الطالب (<b>${name}</b>) تولد (${birth}) أحد طلاب الصف (${stageNames[stage]}) ذو الرقم الامتحاني (${examNum}).`;
                line2 = `قد دخل الامتحان الوزاري للعام الدراسي (${year}) وكان ناجحاً من الدور (${round}).`;
                line3 = `وبناءً على طلبه زود بهذا التأييد.`;
            } else {
                line1 = `نؤيد لكم أن الطالبة (<b>${name}</b>) تولد (${birth}) إحدى طالبات الصف (${stageNames[stage]}) ذات الرقم الامتحاني (${examNum}).`;
                line2 = `وقد دخلت الامتحان الوزاري للعام الدراسي (${year}) وكانت ناجحة من الدور (${round}).`;
                line3 = `وبناءً على طلبها زودت بهذا التأييد.`;
            }

            const subs = subjectsData[stage];
            let tableRows = "";
            subs.forEach((sub, index) => {
                const sName = document.getElementById(`sub_name_${index}`).value;
                const nVal = document.getElementById(`sub_num_${index}`).value;
                const tVal = document.getElementById(`sub_text_${index}`).value;
                tableRows += `<tr><td style="border: 1px solid black; padding: 2px 5px; text-align: right;">${sName}</td><td style="border: 1px solid black; padding: 2px 5px; text-align: center; width: 18%;"><b>${nVal}</b></td><td style="border: 1px solid black; padding: 2px 5px; text-align: center; width: 28%;"><b>${tVal}</b></td></tr>`;
            });

            const extraName = document.getElementById('extra_sub_name').value.trim();
            const extraNum = document.getElementById('extra_sub_num').value.trim();
            const extraText = document.getElementById('extra_sub_text').value.trim();
            if (extraName !== "" || extraNum !== "") {
                tableRows += `<tr><td style="border: 1px solid black; padding: 2px 5px; text-align: right;">${extraName}</td><td style="border: 1px solid black; padding: 2px 5px; text-align: center;"><b>${extraNum}</b></td><td style="border: 1px solid black; padding: 2px 5px; text-align: center;"><b>${extraText}</b></td></tr>`;
            }

            const totalNum = document.getElementById('totalNum').value;
            const totalText = document.getElementById('totalText').value;
            tableRows += `<tr><td style="border: 1px solid black; padding: 2px 5px; font-weight: bold; text-align: right;">المجموع</td><td style="border: 1px solid black; padding: 2px 5px; text-align: center; font-weight: bold;">${totalNum}</td><td style="border: 1px solid black; padding: 2px 5px; text-align: center; font-weight: bold;">${totalText}</td></tr>`;

            if (stage !== 'third') {
                const avgVal = document.getElementById('averageVal').value;
                if(avgVal) {
                    tableRows += `<tr><td style="border: 1px solid black; padding: 2px 5px; font-weight: bold; text-align: right;">المعدل</td><td colspan="2" style="border: 1px solid black; padding: 2px 5px; text-align: center; font-weight: bold;">${avgVal}</td></tr>`;
                }
            }

            const createCardHTML = (isTwoCopies) => `
                <div style="width: 155mm; margin: ${isTwoCopies ? '0.5mm auto' : '4mm auto'}; border: 2px solid #1a202c; padding: ${isTwoCopies ? '3mm 5mm' : '4mm 7mm'}; border-radius: 6px; background: #fff; height: ${isTwoCopies ? '141mm' : '286mm'}; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <!-- الترويسة العليا -->
                        <div style="text-align: center; font-weight: bold; font-size: ${isTwoCopies ? '10px' : '12.5px'}; margin-bottom: 0.5mm; line-height: 1.2;">
                            ${headerTitle}
                        </div>

                        <!-- اسم المدرسة يمين، العدد والتاريخ والصورة يسار -->
                        <table style="width: 100%; border-collapse: collapse; margin-bottom: 1mm; font-weight: bold; font-size: ${isTwoCopies ? '9.5px' : '11px'};">
                            <tr>
                                <td style="width: 50%; vertical-align: top; text-align: right;">
                                    <div>${schoolName}</div>
                                </td>
                                <td style="width: 50%; text-align: left; vertical-align: top;">
                                    <div>العدد: ${bookNum}</div>
                                    <div style="margin-top: 1px;">التاريخ: ${dateVal}</div>
                                    <div style="margin-top: 2px; width: 15mm; height: 19mm; border: 1px dashed #cbd5e0; display: inline-flex; align-items: center; justify-content: center; font-size: 7.5px; color: #a0aec0; background: #fafafa;">مكان الصورة</div>
                                </td>
                            </tr>
                        </table>

                        <div style="text-align: center; font-size: ${isTwoCopies ? '10px' : '12px'}; font-weight: bold; margin-bottom: 0.5mm;">
                            إلى / ${target}
                        </div>

                        <div style="text-align: center; font-size: ${isTwoCopies ? '10px' : '12px'}; font-weight: bold; margin-bottom: 1.5mm;">
                            م / تأييد طالب بالدرجات
                        </div>

                        <!-- النص مقسم على 3 أسطر بمسافات متناسقة -->
                        <div style="font-size: ${isTwoCopies ? '9.5px' : '11px'}; line-height: ${isTwoCopies ? '1.25' : '1.45'}; margin-bottom: 1.5mm;">
                            <div>${line1}</div>
                            <div style="margin-top: 1.5px;">${line2}</div>
                            <div style="margin-top: 1.5px;">${line3}</div>
                        </div>

                        <!-- الجدول بعرض وتنسيق متوازن ومضغوط -->
                        <table style="width: 62%; margin: 0 auto; border-collapse: collapse; font-size: ${isTwoCopies ? '9px' : '10.5px'}; margin-bottom: 1.5mm;">
                            <thead>
                                <tr style="background: #f1f5f9;">
                                    <th style="border: 1px solid black; padding: 2px 4px; text-align: right;">المادة</th>
                                    <th style="border: 1px solid black; padding: 2px 4px; text-align: center; width: 22%;">الدرجة رقماً</th>
                                    <th style="border: 1px solid black; padding: 2px 4px; text-align: center; width: 32%;">الدرجة كتابةً</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tableRows}
                            </tbody>
                        </table>
                    </div>

                    <div style="margin-bottom: 1.5mm;">
                        <div style="text-align: center; font-size: ${isTwoCopies ? '10px' : '11.5px'}; font-weight: bold; margin-bottom: 1mm;">
                            للعلـم مع التقـدير
                        </div>

                        <table style="width: 100%; border-collapse: collapse;">
                            <tr>
                                <td style="width: 75%;"></td>
                                <td style="width: 25%; text-align: right; font-size: ${isTwoCopies ? '9.5px' : '11px'}; line-height: 1.2;">
                                    <b>${manager}</b><br>
                                    مدير المدرسة
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            `;

            const wrapper = document.getElementById('documentWrapper');
            if (layoutMode === 'two') {
                wrapper.innerHTML = `
                    <div style="height: 148.5mm; display: flex; flex-direction: column; justify-content: center;">
                        ${createCardHTML(true)}
                    </div>
                    <div style="height: 148.5mm; display: flex; flex-direction: column; justify-content: center;">
                        ${createCardHTML(true)}
                    </div>
                `;
            } else {
                wrapper.innerHTML = `<div style="height: 297mm; display: flex; flex-direction: column; justify-content: center;">${createCardHTML(false)}</div>`;
            }

            setTimeout(() => {
                window.print();
            }, 150);
        }
    </script>
</body>
</html>
