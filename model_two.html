<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخاطبات العامة والإجابة على البريد</title>
    <!-- استيراد باقة الخطوط العربية المتنوعة -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Changa:wght@400;700&family=El+Messiri:wght@400;700&family=Lateef&family=Readex+Pro:wght@400;700&family=Reem+Kufi:wght@400;700&family=Scheherazade+New:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            direction: rtl;
            color: #2d3748;
        }
        .form-container {
            max-width: 750px;
            background: #ffffff;
            margin: 0 auto;
            padding: 18px 20px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            border-top: 5px solid #d69e2e;
        }
        .form-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
        }
        h2 {
            color: #1a202c;
            margin: 0;
            font-size: 19px;
            font-weight: 700;
        }
        
        .section-box {
            border: 1px solid rgba(0,0,0,0.07);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .sec-print { background: #f0f9ff; border-color: #bae6fd; }
        .sec-admin { background: #fdf4ff; border-color: #f5d0fe; }
        .sec-person { background: #f0fdf4; border-color: #bbf7d0; }

        .section-title {
            font-size: 13.5px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
            padding-bottom: 4px;
        }
        .sec-print .section-title { color: #0284c7; }
        .sec-admin .section-title { color: #c084fc; }
        .sec-person .section-title { color: #16a34a; }

        .form-group {
            margin-bottom: 8px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
            color: #4a5568;
            font-size: 12.5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
            background-color: #fff;
            transition: all 0.2s;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #d69e2e;
            box-shadow: 0 0 0 3px rgba(214, 158, 46, 0.15);
        }
        .btn-submit {
            background: linear-gradient(135deg, #d69e2e 0%, #b7791f 100%);
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 14.5px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 4px;
            box-shadow: 0 4px 12px rgba(214, 158, 46, 0.25);
            transition: all 0.2s;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #b7791f 100%, #975a16 100%);
            box-shadow: 0 6px 15px rgba(214, 158, 46, 0.35);
        }
        .back-link {
            display: inline-block;
            background-color: #edf2f7;
            color: #4a5568;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .back-link:hover {
            background-color: #e2e8f0;
            color: #1a202c;
        }
        .back-link-bottom {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .btn-save-cache {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-save-cache:hover { background-color: #2b6cb0; }
        
        .btn-clear-cache {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-clear-cache:hover { background-color: #c53030; }

        #printArea {
            display: none;
        }

        @media print {
            @page {
                size: A4;
                margin: 0mm;
            }
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                display: block;
                position: absolute;
                top: 0;
                right: 0;
                width: 210mm;
                height: 297mm;
                overflow: hidden;
                background: white;
                box-sizing: border-box;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="form-container no-print">
        <div class="form-header-flex">
            <h2>المخاطبات العامة والإجابة على البريد</h2>
            <a href="namatj_mukhataba.html" class="back-link">← العودة للنماذج</a>
        </div>

        <form id="generalLetterForm" onsubmit="generatePDF(event)">
            
            <div class="section-box sec-print">
                <div class="section-title">⚙️ خيارات وتنسيق الطباعة، الإطارات والخطوط المتقدمة</div>
                
                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>نظام النسخ:</label>
                        <select id="copiesLayout">
                            <option value="one">نسخة واحدة (تملأ الصفحة)</option>
                            <option value="two">نسختان (نفس الورقة)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>إطار الورقة الفني:</label>
                        <select id="borderStyleInput">
                            <option value="solid-normal">إطار رسمي أنيق (عادي)</option>
                            <option value="solid-thick">إطار سميك بارز</option>
                            <option value="double">إطار مزدوج كلاسيكي</option>
                            <option value="fancy-double">إطار زخرفي مزدوج رفيع</option>
                            <option value="rounded">إطار بزوايا منحنية أنيقة</option>
                            <option value="dashed">إطار منقط رسمي</option>
                            <option value="none">بدون إطار</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>لون الخط العام:</label>
                        <select id="fontColorInput">
                            <option value="#000000">أسود داكن (أصلي)</option>
                            <option value="#1e3a8a">أزرق ملكي إداري</option>
                            <option value="#991b1b">أحمر رسمي</option>
                            <option value="#334155">رمادي غامق احترافي</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>نوع الخط (النص الأساسي + التوقيع):</label>
                        <select id="fontFamilyInput">
                            <option value="'Traditional Arabic', serif">Traditional Arabic (التقليدي الرسمي)</option>
                            <option value="'Amiri', serif">أميري (Amiri - أصيل)</option>
                            <option value="'Scheherazade New', serif" selected>شهرزاد (Scheherazade - كلاسيكي)</option>
                            <option value="'Reem Kufi', sans-serif">الخط الكوفي (Reem Kufi)</option>
                            <option value="'El Messiri', sans-serif">المسيري (El Messiri - مميز)</option>
                            <option value="'Lateef', serif">لطيف (Lateef - نسخ دقيق)</option>
                            <option value="'Tajawal', sans-serif">تجوال (Tajawal - حديث)</option>
                            <option value="'Cairo', sans-serif">كايرو (Cairo - عريض)</option>
                            <option value="'Changa', sans-serif">شنطة/شانجا (Changa)</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>حجم الخط (النص الأساسي + التوقيع):</label>
                        <select id="fontSizeInput">
                            <option value="14px">14</option>
                            <option value="15px">15</option>
                            <option value="16px">16</option>
                            <option value="17px">17</option>
                            <option value="18px">18</option>
                            <option value="19px">19</option>
                            <option value="20px">20</option>
                            <option value="22px" selected>22</option>
                            <option value="24px">24</option>
                            <option value="26px">26</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>نوع خط العناوين:</label>
                        <select id="titleFontFamilyInput">
                            <option value="inherit">نفس خط النص الأساسي</option>
                            <option value="'Amiri', serif" selected>أميري (Amiri)</option>
                            <option value="'Cairo', sans-serif">كايرو (Cairo)</option>
                            <option value="'Reem Kufi', sans-serif">الخط الكوفي (Reem Kufi)</option>
                            <option value="'Tajawal', sans-serif">تجوال (Tajawal)</option>
                        </select>
                    </div>
                </div>

                <div style="margin-top: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>حجم خط العناوين:</label>
                        <select id="titleFontSizeInput">
                            <option value="matched">تلقائي متناسق</option>
                            <option value="16px">16px</option>
                            <option value="18px" selected>18px</option>
                            <option value="20px">20px</option>
                            <option value="22px">22px</option>
                            <option value="24px">24px</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="section-box sec-admin">
                <div class="section-title">📋 المعلومات الإدارية للكتاب</div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>الترويسة العليا:</label>
                        <input type="text" id="headerTitleInput" required placeholder="المديرية العامة لتربية القادسية - قسم تربية الحمزة">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>اسم المؤسسة (المدرسة):</label>
                        <input type="text" id="schoolNameInput" required placeholder="اعدادية النجدين للبنين">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>رقم العدد:</label>
                        <input type="text" id="bookNumberInput" required placeholder="مثال 1233">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>التاريخ:</label>
                        <input type="date" id="dateInput" required>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>إلى (الجهة الموجه لها الكتاب - يضاف حرفياً تلقائياً):</label>
                        <input type="text" id="toInput" required placeholder="المديرية العامة لتربية القادسية / شعبة...">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>موضوع الكتاب (العنوان الرئيسي - يضاف حرفياً تلقائياً):</label>
                        <input type="text" id="subjectTitleInput" required placeholder="الإجابة على الكتاب المرقم...">
                    </div>
                </div>
            </div>

            <div class="section-box sec-person">
                <div class="section-title">✍️ نص المخاطبة أو الإجابة</div>
                
                <div class="form-group">
                    <label>النص الأساسي (يمكنك كتابة عدة أسطر أو فقرات بحرية):</label>
                    <textarea id="mainContentInput" rows="6" required placeholder="اكتب نص المخاطبة أو الإجابة التفصيلية هنا..."></textarea>
                </div>

                <div class="form-group" style="margin-top: 8px;">
                    <label>اسم مدير المدرسة:</label>
                    <input type="text" id="managerNameInput" required placeholder="اسم المدير">
                </div>
            </div>

            <button type="submit" class="btn-submit">عرض وطباعة المخاطبة (PDF)</button>
        </form>

        <div class="back-link-bottom">
            <a href="namatj_mukhataba.html" class="back-link">← العودة للنماذج</a>
            <button type="button" class="btn-save-cache" onclick="manualSaveSettings()">حفظ مؤقت للإعدادات والترويسة</button>
            <button type="button" class="btn-clear-cache" onclick="manualClearSettings()">إلغاء وحذف الحفظ المؤقت</button>
        </div>
    </div>

    <div id="printArea">
        <div id="documentWrapper" style="width: 100%; height: 100%; box-sizing: border-box;"></div>
    </div>

    <script>
        // الحفظ اليدوي المؤقت
        function manualSaveSettings() {
            localStorage.setItem('saved_headerTitle_gen', document.getElementById('headerTitleInput').value);
            localStorage.setItem('saved_schoolName_gen', document.getElementById('schoolNameInput').value);
            localStorage.setItem('saved_managerName_gen', document.getElementById('managerNameInput').value);
            localStorage.setItem('saved_fontFamily_gen', document.getElementById('fontFamilyInput').value);
            localStorage.setItem('saved_fontSize_gen', document.getElementById('fontSizeInput').value);
            localStorage.setItem('saved_titleFontFamily_gen', document.getElementById('titleFontFamilyInput').value);
            localStorage.setItem('saved_titleFontSize_gen', document.getElementById('titleFontSizeInput').value);
            localStorage.setItem('saved_borderStyle_gen', document.getElementById('borderStyleInput').value);
            localStorage.setItem('saved_fontColor_gen', document.getElementById('fontColorInput').value);
            alert('تم حفظ الإعدادات والترويسة مؤقتاً بنجاح!');
        }

        // إلغاء وحذف الحفظ المؤقت
        function manualClearSettings() {
            localStorage.removeItem('saved_headerTitle_gen');
            localStorage.removeItem('saved_schoolName_gen');
            localStorage.removeItem('saved_managerName_gen');
            localStorage.removeItem('saved_fontFamily_gen');
            localStorage.removeItem('saved_fontSize_gen');
            localStorage.removeItem('saved_titleFontFamily_gen');
            localStorage.removeItem('saved_titleFontSize_gen');
            localStorage.removeItem('saved_borderStyle_gen');
            localStorage.removeItem('saved_fontColor_gen');
            alert('تم إلغاء وحذف كافة البيانات المحفوظة مؤقتاً وعودتها للأصل.');
            location.reload();
        }

        // استرجاع الإعدادات المحفوظة مؤقتاً
        function loadSettingsIfSaved() {
            if(localStorage.getItem('saved_headerTitle_gen')) {
                document.getElementById('headerTitleInput').value = localStorage.getItem('saved_headerTitle_gen');
                document.getElementById('schoolNameInput').value = localStorage.getItem('saved_schoolName_gen');
                document.getElementById('managerNameInput').value = localStorage.getItem('saved_managerName_gen');
                document.getElementById('fontFamilyInput').value = localStorage.getItem('saved_fontFamily_gen');
                document.getElementById('fontSizeInput').value = localStorage.getItem('saved_fontSize_gen');
                document.getElementById('titleFontFamilyInput').value = localStorage.getItem('saved_titleFontFamily_gen');
                document.getElementById('titleFontSizeInput').value = localStorage.getItem('saved_titleFontSize_gen');
                document.getElementById('borderStyleInput').value = localStorage.getItem('saved_borderStyle_gen');
                document.getElementById('fontColorInput').value = localStorage.getItem('saved_fontColor_gen');
            }
        }

        window.onload = function() {
            loadSettingsIfSaved();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateInput').value = today;
        };

        function formatDateToDMY(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }

        function generatePDF(e) {
            e.preventDefault();
            
            const headerTitle = document.getElementById('headerTitleInput').value;
            const schoolName = document.getElementById('schoolNameInput').value;
            const bookNum = document.getElementById('bookNumberInput').value;
            const dateVal = formatDateToDMY(document.getElementById('dateInput').value);
            
            let toVal = document.getElementById('toInput').value.trim();
            if (!toVal.startsWith('الى /') && !toVal.startsWith('إلى /')) {
                toVal = 'الى / ' + toVal;
            }

            let subjectTitle = document.getElementById('subjectTitleInput').value.trim();
            if (!subjectTitle.startsWith('م /') && !subjectTitle.startsWith('م/')) {
                subjectTitle = 'م / ' + subjectTitle;
            }
            
            const rawContent = document.getElementById('mainContentInput').value;
            const formattedContent = rawContent.replace(/\n/g, '<br>');

            const managerName = document.getElementById('managerNameInput').value;
            const layoutMode = document.getElementById('copiesLayout').value;
            
            const selectedFont = document.getElementById('fontFamilyInput').value;
            const baseFontSize = parseInt(document.getElementById('fontSizeInput').value);
            const borderStyleChoice = document.getElementById('borderStyleInput').value;
            const fontColor = document.getElementById('fontColorInput').value;
            
            const titleFont = document.getElementById('titleFontFamilyInput').value;
            const titleSizeChoice = document.getElementById('titleFontSizeInput').value;

            let borderCSS = "2.5px solid #1a202c";
            let borderRadiusCSS = "8px";
            if (borderStyleChoice === 'solid-thick') borderCSS = "4px solid #1a202c";
            if (borderStyleChoice === 'double') borderCSS = "4px double #1a202c";
            if (borderStyleChoice === 'fancy-double') borderCSS = "1px solid #1a202c; outline: 2px solid #1a202c; outline-offset: 3px;";
            if (borderStyleChoice === 'rounded') { borderCSS = "2.5px solid #1a202c"; borderRadiusCSS = "20px"; }
            if (borderStyleChoice === 'dashed') borderCSS = "2px dashed #1a202c";
            if (borderStyleChoice === 'none') borderCSS = "none";

            const bodySize = baseFontSize + 'px';
            const twoCopiesBodySize = (baseFontSize - 3) + 'px';

            const actualTitleFont = titleFont === 'inherit' ? selectedFont : titleFont;
            const actualTitleSize = titleSizeChoice === 'matched' ? (baseFontSize + 2) + 'px' : titleSizeChoice;
            const twoCopiesTitleSize = titleSizeChoice === 'matched' ? '12.5px' : (parseInt(titleSizeChoice) - 3) + 'px';

            const createCardHTML = (isTwoCopies) => `
                <div style="font-family: ${selectedFont}; color: ${fontColor}; margin: ${isTwoCopies ? '2mm 6mm' : '5mm 8mm'}; border: ${borderCSS}; border-radius: ${borderRadiusCSS}; padding: ${isTwoCopies ? '4mm 6mm' : '8mm 14mm'}; background: #fff; height: ${isTwoCopies ? '135mm' : '287mm'}; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <div style="font-family: ${actualTitleFont}; text-align: center; font-weight: bold; font-size: ${isTwoCopies ? twoCopiesTitleSize : actualTitleSize}; margin-bottom: ${isTwoCopies ? '1.5mm' : '4mm'};">
                            ${headerTitle}
                        </div>

                        <!-- جدول العدد والتاريخ في اليسار واسم المدرسة والإدارة في اليمين -->
                        <table style="width: 100%; border-collapse: collapse; margin-bottom: ${isTwoCopies ? '2.5mm' : '6mm'}; font-weight: bold; font-family: ${actualTitleFont}; font-size: ${isTwoCopies ? twoCopiesTitleSize : actualTitleSize}; color: ${fontColor};">
                            <tr>
                                <td style="width: 50%; text-align: right; vertical-align: top;">إدارة / ${schoolName}</td>
                                <td style="width: 50%; text-align: left; vertical-align: top;">
                                    <div style="display: inline-block; text-align: right; min-width: 130px;">
                                        العدد: ${bookNum}<br>
                                        التاريخ: ${dateVal}
                                    </div>
                                </td>
                            </tr>
                        </table>

                        <div style="font-family: ${actualTitleFont}; text-align: right; font-size: ${isTwoCopies ? twoCopiesTitleSize : actualTitleSize}; font-weight: bold; margin-bottom: ${isTwoCopies ? '2.5mm' : '5mm'}; padding-right: 2mm;">
                            ${toVal}
                        </div>

                        <div style="font-family: ${actualTitleFont}; text-align: right; font-size: ${isTwoCopies ? twoCopiesTitleSize : actualTitleSize}; font-weight: bold; margin-bottom: ${isTwoCopies ? '4mm' : '8mm'}; padding-right: 2mm;">
                            ${subjectTitle}
                        </div>

                        <div style="font-size: ${isTwoCopies ? twoCopiesBodySize : bodySize}; line-height: ${isTwoCopies ? '1.8' : '2.3'}; text-align: justify; padding: 0 2mm;">
                            ${formattedContent}
                        </div>
                    </div>

                    <!-- عبارة للعلم مع التقدير وتوقيع مدير المدرسة في الجهة اليسرى داخل إطار منفصل -->
                    <div style="margin-bottom: ${isTwoCopies ? '10mm' : '22mm'};">
                        <div style="text-align: center; font-size: ${isTwoCopies ? twoCopiesBodySize : bodySize}; font-weight: bold; margin-bottom: ${isTwoCopies ? '4mm' : '10mm'};">
                            للعلـم مع التقـدير
                        </div>

                        <table style="width: 100%; border-collapse: collapse; color: ${fontColor};">
                            <tr>
                                <td style="width: 45%;"></td>
                                <td style="width: 55%; text-align: left; padding-left: 5mm;">
                                    <div style="display: inline-block; border: 1.5px solid #1a202c; border-radius: 6px; padding: 6px 14px; text-align: center; font-size: ${isTwoCopies ? twoCopiesBodySize : bodySize}; line-height: 1.4; background: #fff;">
                                        <b>${managerName}</b><br>
                                        <span>مدير المدرسة</span>
                                    </div>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            `;

            const wrapper = document.getElementById('documentWrapper');

            if (layoutMode === 'two') {
                wrapper.innerHTML = `
                    <div style="height: 148.5mm; display: flex; flex-direction: column; justify-content: flex-start;">
                        ${createCardHTML(true)}
                    </div>
                    <div style="height: 148.5mm; display: flex; flex-direction: column; justify-content: flex-end;">
                        ${createCardHTML(true)}
                    </div>
                `;
            } else {
                wrapper.innerHTML = `<div style="height: 297mm; display: flex; flex-direction: column; justify-content: center;">${createCardHTML(false)}</div>`;
            }

            window.print();
        }
    </script>

</body>
</html>
