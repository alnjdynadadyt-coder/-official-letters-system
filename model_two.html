<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج مخاطبة ثاني</title>
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 10px;
            direction: rtl;
            color: #2d3748;
        }
        .form-container {
            max-width: 750px;
            background: #ffffff;
            margin: 0 auto;
            padding: 18px 20px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            border-top: 5px solid #3182ce;
        }
        .form-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 8px;
        }
        h2 {
            color: #1a202c;
            margin: 0;
            font-size: 19px;
            font-weight: 700;
        }
        
        .section-box {
            border: 1px solid rgba(0,0,0,0.07);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .sec-print { background: #f0f9ff; border-color: #bae6fd; }
        .sec-admin { background: #fdf4ff; border-color: #f5d0fe; }
        .sec-person { background: #f0fdf4; border-color: #bbf7d0; }

        .section-title {
            font-size: 13.5px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
            padding-bottom: 4px;
        }
        .sec-print .section-title { color: #0284c7; }
        .sec-admin .section-title { color: #c084fc; }
        .sec-person .section-title { color: #16a34a; }

        .form-group {
            margin-bottom: 8px;
        }
        .form-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
            color: #4a5568;
            font-size: 12.5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 13px;
            box-sizing: border-box;
            background-color: #fff;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }
        .btn-submit {
            background: linear-gradient(135deg, #3182ce 0%, #2b6cb0 100%);
            color: white;
            border: none;
            padding: 11px 20px;
            font-size: 14.5px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 4px;
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.25);
            transition: all 0.2s;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #2b6cb0 100%, #2c5282 100%);
            box-shadow: 0 6px 15px rgba(49, 130, 206, 0.35);
        }
        .back-link {
            display: inline-block;
            background-color: #edf2f7;
            color: #4a5568;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .back-link:hover {
            background-color: #e2e8f0;
            color: #1a202c;
        }
        .back-link-bottom {
            display: block;
            text-align: center;
            margin-top: 12px;
        }

        #printArea {
            display: none;
        }

        @media print {
            @page {
                size: A4;
                margin: 0mm;
            }
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                display: block;
                position: absolute;
                top: 0;
                right: 0;
                width: 210mm;
                height: 297mm;
                overflow: hidden;
                background: white;
                color: black;
                box-sizing: border-box;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="form-container no-print">
        <div class="form-header-flex">
            <h2>نموذج مخاطبة ثاني</h2>
            <a href="namatj_mukhataba.html" class="back-link">← العودة للنماذج</a>
        </div>

        <form id="modelTwoForm" onsubmit="generatePDF(event)">
            
            <div class="section-box sec-print">
                <div class="section-title">⚙️ خيارات وتنسيق الخط والطباعة</div>
                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>نظام النسخ:</label>
                        <select id="copiesLayout">
                            <option value="one">نسخة واحدة (تملأ الصفحة)</option>
                            <option value="two">نسختان (نفس الورقة)</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>نوع الخط للطباعة:</label>
                        <select id="fontFamilyInput">
                            <option value="'Traditional Arabic', serif">Traditional Arabic (التقليدي الرسمي)</option>
                            <option value="'Amiri', serif">Amiri (أميري)</option>
                            <option value="'Simplified Arabic', sans-serif">Simplified Arabic (المبسط)</option>
                            <option value="'Arial', sans-serif">Arial (أريال)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>حجم الخط للنص الأساسي:</label>
                    <select id="fontSizeInput">
                        <option value="16px">16 (مناسب)</option>
                        <option value="17px">17 (واضح)</option>
                        <option value="18px" selected>18 (رسمي وكبير ممتاز)</option>
                        <option value="19px">19 (كبير جداً)</option>
                        <option value="20px">20 (ضخم)</option>
                    </select>
                </div>
            </div>

            <div class="section-box sec-admin">
                <div class="section-title">📋 المعلومات الإدارية للكتاب</div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>الترويسة العليا:</label>
                        <input type="text" id="headerTitleInput" required placeholder="المديرية العامة لتربية القادسية - قسم تربية الحمزة">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>اسم المؤسسة:</label>
                        <input type="text" id="schoolNameInput" required placeholder="اعدادية النجدين للبنين">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>رقم العدد:</label>
                        <input type="text" id="bookNumberInput" required placeholder="مثال 106">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>التاريخ:</label>
                        <input type="date" id="dateInput" required>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 8px;">
                    <div class="form-group" style="flex: 1;">
                        <label>إلى (الجهة الموجه لها الكتاب):</label>
                        <input type="text" id="toInput" required placeholder="إلى / ...">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>موضوع الكتاب (عنوان المذكرة):</label>
                        <input type="text" id="subjectTitleInput" required placeholder="م/ طلب...">
                    </div>
                </div>
            </div>

            <div class="section-box sec-person">
                <div class="section-title">📄 نص الموضوع والمحتوى</div>
                <div class="form-group">
                    <label>نص الكتاب (مضمون المخاطبة):</label>
                    <textarea id="bookBodyInput" rows="4" required placeholder="اكتب نص المخاطبة أو التفاصيل هنا..."></textarea>
                </div>

                <div class="form-group" style="margin-top: 8px;">
                    <label>اسم مدير المدرسة:</label>
                    <input type="text" id="managerNameInput" required placeholder="اسم المدير">
                </div>
            </div>

            <button type="submit" class="btn-submit">عرض وطباعة النموذج (PDF)</button>
        </form>

        <div class="back-link-bottom">
            <a href="namatj_mukhataba.html" class="back-link">← العودة للنماذج</a>
        </div>
    </div>

    <div id="printArea">
        <div id="documentWrapper" style="width: 100%; height: 100%; box-sizing: border-box;"></div>
    </div>

    <script>
        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateInput').value = today;
        };

        function formatDateToDMY(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }

        function generatePDF(e) {
            e.preventDefault();
            
            const headerTitle = document.getElementById('headerTitleInput').value;
            const schoolName = document.getElementById('schoolNameInput').value;
            const bookNum = document.getElementById('bookNumberInput').value;
            const dateVal = formatDateToDMY(document.getElementById('dateInput').value);
            const toVal = document.getElementById('toInput').value;
            const subjectTitle = document.getElementById('subjectTitleInput').value;
            const bookBody = document.getElementById('bookBodyInput').value;
            
            const managerName = document.getElementById('managerNameInput').value;
            const layoutMode = document.getElementById('copiesLayout').value;
            const selectedFont = document.getElementById('fontFamilyInput').value;
            const baseFontSize = parseInt(document.getElementById('fontSizeInput').value);

            const headerSize = (baseFontSize + 3) + 'px';
            const subTitleSize = (baseFontSize + 1) + 'px';
            const tableSize = (baseFontSize - 1) + 'px';
            const bodySize = baseFontSize + 'px';
            const twoCopiesBodySize = (baseFontSize - 3) + 'px';

            const createCardHTML = (isTwoCopies) => `
                <div style="font-family: ${selectedFont}; margin: ${isTwoCopies ? '2mm 10mm' : '10mm 15mm'}; border: 2.5px solid #1a202c; padding: ${isTwoCopies ? '5mm 8mm' : '12mm 18mm'}; border-radius: 8px; background: #fff; height: ${isTwoCopies ? '133mm' : '275mm'}; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <div style="text-align: center; font-weight: bold; font-size: ${isTwoCopies ? subTitleSize : headerSize}; margin-bottom: ${isTwoCopies ? '2mm' : '6mm'};">
                            ${headerTitle}
                        </div>

                        <table style="width: 100%; border-collapse: collapse; margin-bottom: ${isTwoCopies ? '3mm' : '8mm'}; font-weight: bold; font-size: ${isTwoCopies ? '13px' : tableSize};">
                            <tr>
                                <td style="width: 50%; text-align: right;">إدارة / ${schoolName}</td>
                                <td style="width: 50%; text-align: left;">
                                    العدد: ${bookNum}<br>
                                    التاريخ: ${dateVal}
                                </td>
                            </tr>
                        </table>

                        <div style="text-align: center; font-size: ${isTwoCopies ? '13.5px' : subTitleSize}; font-weight: bold; margin-bottom: ${isTwoCopies ? '3mm' : '6mm'};">
                            إلى / ${toVal}
                        </div>

                        <div style="text-align: center; font-size: ${isTwoCopies ? '13.5px' : subTitleSize}; font-weight: bold; margin-bottom: ${isTwoCopies ? '5mm' : '10mm'};">
                            ${subjectTitle}
                        </div>

                        <div style="font-size: ${isTwoCopies ? twoCopiesBodySize : bodySize}; line-height: ${isTwoCopies ? '1.8' : '2.3'}; text-align: justify; padding: 0 2mm; white-space: pre-line;">
                            ${bookBody}
                        </div>
                    </div>

                    <div style="margin-bottom: ${isTwoCopies ? '12mm' : '35mm'};">
                        <div style="text-align: center; font-size: ${isTwoCopies ? '13.5px' : subTitleSize}; font-weight: bold; margin-bottom: ${isTwoCopies ? '3mm' : '8mm'};">
                            للعلـم مع التقـدير
                        </div>

                        <table style="width: 100%; border-collapse: collapse;">
                            <tr>
                                <td style="width: 75%;"></td>
                                <td style="width: 25%; text-align: right; font-size: ${isTwoCopies ? '13px' : tableSize}; line-height: 1.3; padding-right: 5px;">
                                    <b>${managerName}</b><br>
                                    مدير المدرسة
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>
            `;

            const wrapper = document.getElementById('documentWrapper');

            if (layoutMode === 'two') {
                wrapper.innerHTML = `
                    <div style="height: 148.5mm; display: flex; flex-direction: column; justify-content: flex-start;">
                        ${createCardHTML(true)}
                    </div>
                    <div style="height: 148.5mm; display: flex; flex-direction: column; justify-content: flex-end;">
                        ${createCardHTML(true)}
                    </div>
                `;
            } else {
                wrapper.innerHTML = `<div style="height: 297mm; display: flex; flex-direction: column; justify-content: center;">${createCardHTML(false)}</div>`;
            }

            window.print();
        }
    </script>

</body>
</html>
