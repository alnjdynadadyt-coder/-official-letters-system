<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نماذج مخاطبة - نظام إصدار الكتب</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1c29 0%, #2a2d43 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 10px;
            direction: rtl;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .main-container {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .header-section {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }
        h1 {
            color: #ffffff;
            margin: 0 0 8px 0;
            font-size: 21px;
            font-weight: 700;
        }
        p {
            color: #a0aec0;
            margin: 0;
            font-size: 13px;
        }
        
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .menu-btn:hover {
            background: rgba(49, 130, 206, 0.25);
            border-color: #3182ce;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(49, 130, 206, 0.2);
        }
        .btn-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-btn span.icon {
            font-size: 18px;
        }
        .menu-btn span.arrow {
            color: #a0aec0;
            font-size: 14px;
        }

        .back-nav {
            text-align: center;
            margin-top: 20px;
        }
        .back-link {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .back-link:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header-section">
            <h1>📁 نماذج مخاطبة</h1>
            <p>اختر النموذج المطلوب لفتح صفحته الخاصة وكوده المستقل</p>
        </div>

        <!-- الزر الأول: نموذج تأييد مدرس (يوجه لملف خاص به) -->
        <a href="teacher-taiyid.html" class="menu-btn">
            <div class="btn-content">
                <span class="icon">👨‍🏫</span>
                <span>تأييد مدرس (نموذج جديد)</span>
            </div>
            <span class="arrow">←</span>
        </a>

        <!-- الزر الثاني: نموذج تأييد موظف (يوجه لملف خاص به) -->
        <a href="employee-taiyid.html" class="menu-btn">
            <div class="btn-content">
                <span class="icon">👨‍💼</span>
                <span>تأييد موظف (نموذج جديد)</span>
            </div>
            <span class="arrow">←</span>
        </a>

        <!-- الزر الثالث: نموذج إضافي مستقبلي -->
        <a href="other-letter.html" class="menu-btn">
            <div class="btn-content">
                <span class="icon">📜</span>
                <span>نموذج مخاطبة إضافي</span>
            </div>
            <span class="arrow">←</span>
        </a>

        <div class="back-nav">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
        </div>
    </div>

</body>
</html>
