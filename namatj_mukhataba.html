<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نماذج مخاطبة - نظام إصدار الكتب والمخاطبات الرسمية</title>
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        body {
            background: radial-gradient(circle at 50% 10%, #4a2832 0%, #2c161d 40%, #150a0e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            direction: rtl;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .dashboard-container {
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            margin: auto;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .dashboard-header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 15px;
        }
        h1 {
            color: #ffffff;
            margin: 0 0 10px 0;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .sub-designer {
            display: block;
            font-size: 14.5px;
            color: #f6ad55;
            font-weight: 600;
            margin-top: 6px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }
        p.subtitle {
            color: #cbd5e1;
            font-size: 13.5px;
            margin: 12px 0 0 0;
            font-weight: 500;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            border-radius: 14px;
            text-decoration: none;
            color: #f1f5f9;
            font-weight: 600;
            font-size: 15.5px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .menu-item span.icon-text {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .menu-item .emoji {
            font-size: 22px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2);
        }
        .menu-item .arrow {
            color: #cbd5e1;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.05);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-item:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(246, 173, 85, 0.5);
            box-shadow: 0 12px 25px -5px rgba(246, 173, 85, 0.2);
            color: #ffffff;
        }
        .menu-item:hover .arrow {
            transform: translateX(-5px);
            color: #f6ad55;
            background: rgba(246, 173, 85, 0.2);
        }
        .menu-item:hover .emoji {
            background: rgba(246, 173, 85, 0.25);
            transform: scale(1.05);
        }
        .back-nav {
            text-align: center;
            margin-top: 25px;
        }
        .back-link {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #f6ad55;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>
                📁 نماذج مخاطبة
                <span class="sub-designer">نظام إصدار الكتب والمخاطبات الرسمية</span>
            </h1>
            <p class="subtitle">اختر النموذج الفرعي المطلوب لإصداره</p>
        </div>

        <div class="menu-list">
            <!-- الزر الأول مفعل ومرتبط بملف النموذج الجديد -->
            <a href="model_one_new.html" class="menu-item">
                <span class="icon-text">
                    <span class="emoji">📝</span>
                    تأييد استمرار مدرس أو موظف
                </span>
                <span class="arrow">←</span>
            </a>

            <!-- الزر الثاني (يمكن تحديثه لاحقاً) -->
            <a href="#" class="menu-item">
                <span class="icon-text">
                    <span class="emoji">📋</span>
                    نموذج مخاطبة ثاني (قريباً)
                </span>
                <span class="arrow">←</span>
            </a>
        </div>

        <div class="back-nav">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>
        </div>
    </div>

</body>
</html>
